schema_version: 1

context:
  name: libipld
  version: "4.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/libipld-${{ version }}.tar.gz
  sha256: d42095107483a7c030f0939b934420011bcacd2e5cd0044b209fdfb64c820a8d

build:
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.2,<2.0
  host:
    - python
    - maturin >=1.8.7,<2.0
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - libipld
      pip_check: true

about:
  summary: Python binding to the Rust IPLD library
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/libipld/

extra:
  recipe-maintainers:
    - akrherz
